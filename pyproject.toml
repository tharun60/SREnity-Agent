[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sre-learning-agent"
version = "0.1.0"
description = "A vendor-neutral, approval-gated SRE agent learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "prometheus-client>=0.20,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=30,<33"]
mcp = ["mcp>=1.0,<2"]
llm = ["openai>=1.40,<3"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.5,<1"]
all = ["sre-learning-agent[kubernetes,mcp,llm,dev]"]

[project.scripts]
sre-agent = "sre_agent.cli:app"
sre-mcp = "sre_agent.mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

